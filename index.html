<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure CSS Aurora Background & Icon</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #0f172a;
      background-image:
        radial-gradient(at 15% 20%, rgba(168, 85, 247, 0.45) 0px, transparent 50%),
        radial-gradient(at 85% 25%, rgba(56, 189, 248, 0.45) 0px, transparent 50%),
        radial-gradient(at 50% 85%, rgba(244, 114, 182, 0.4) 0px, transparent 55%),
        radial-gradient(at 80% 80%, rgba(52, 211, 153, 0.3) 0px, transparent 50%);
      font-family: system-ui, -apple-system, sans-serif;
    }


    .icon-badge {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      display: grid;
      place-items: center;
      transition: transform 0.3s ease;
    }

    .icon-badge:hover {
      transform: translateY(-4px) scale(1.04);
    }

    
    .moon-icon {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      box-shadow: -6px 5px 0 0 #fde047;
      transform: translate(4px, -3px);
      filter: drop-shadow(0 0 8px rgba(253, 224, 71, 0.6));
    }

  
    .sparkle {
      position: absolute;
      top: 14px;
      right: 15px;
      width: 12px;
      height: 12px;
      background: #ffffff;
      clip-path: polygon(
        50% 0%,
        63% 37%,
        100% 50%,
        63% 63%,
        50% 100%,
        37% 63%,
        0% 50%,
        37% 37%
      );
      animation: twinkle 2.4s ease-in-out infinite;
    }

   <!--add-->
    @keyframes twinkle {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(0.65); opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div class="icon-badge" aria-label="Moon and star icon">
    <div class="moon-icon"></div>
    <div class="sparkle"></div>
    
  </div>
<h1>hello</h1>
<h3>hello</h3>

</body>
</html>
